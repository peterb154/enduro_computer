name: TrailDash
options:
  bundleIdPrefix: com.peterb154
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DG7BS9366P # free personal team
targets:
  TrailDash:
    type: application
    platform: iOS
    sources: [TrailDash, Shared]
    dependencies:
      - target: TrailDashWidgets
    scheme:
      testTargets: [TrailDashTests]
    info:
      path: TrailDash/Info.plist
      properties:
        CFBundleDisplayName: TrailDash
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: Connects to your heart rate strap or watch.
        NSLocationWhenInUseUsageDescription: Records your ride track, distance, and speed.
        UIBackgroundModes: [bluetooth-central, location]
        # Ride files show up in the Files app under On My iPhone > TrailDash
        UIFileSharingEnabled: true
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  TrailDashTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrailDashTests]
    dependencies:
      - target: TrailDash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TrailDashWidgets:
    type: app-extension
    platform: iOS
    sources: [TrailDashWidgets, Shared]
    info:
      path: TrailDashWidgets/Info.plist
      properties:
        CFBundleDisplayName: TrailDash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterb154.TrailDash.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
