name: TrailDash
options:
  bundleIdPrefix: com.peterb154
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: set once Xcode is signed in (free personal team)
targets:
  TrailDash:
    type: application
    platform: iOS
    sources: [TrailDash]
    scheme: {}
    info:
      path: TrailDash/Info.plist
      properties:
        CFBundleDisplayName: TrailDash
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
